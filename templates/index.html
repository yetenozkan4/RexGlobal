<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RexGlobal — CS2 Item Mağazası</title>
<style>
  /* GITHUB'DAN ALDIĞIN TÜM CSS BURADA - HİÇBİRİNE DOKUNMADIM */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f1114; color: #c6d4df; min-height: 100vh; }
  .topbar { background: #171a21; border-bottom: 1px solid #2a2d35; padding: 0 2rem; height: 52px; display: flex; align-items: center; gap: 2rem; }
  .logo { font-size: 20px; font-weight: 700; color: #fff; text-decoration: none; letter-spacing: -0.3px; }
  .logo span { color: #66c0f4; }
  .topbar-links { display: flex; gap: 0; margin-left: 1rem; }
  .topbar-link { color: #8f98a0; text-decoration: none; font-size: 13px; padding: 0 14px; height: 52px; display: flex; align-items: center; border-bottom: 2px solid transparent; transition: color .15s, border-color .15s; }
  .topbar-link:hover { color: #c6d4df; }
  .topbar-link.active { color: #fff; border-bottom-color: #66c0f4; }
  .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #171a21;
    padding: 15px 30px;
    border-bottom: 1px solid #2a2d35;
}

nav a {
    color: #c6d4df;
    text-decoration: none;
    margin-right: 20px;
}

.auth-box {
    display: flex;
    gap: 15px;
    align-items: center;
}
  
  /* ADMIN BUTONU EKLEMESİ */
  .admin-link { color: #eb4b4b; font-size: 12px; text-decoration: none; border: 1px solid #eb4b4b; padding: 4px 8px; border-radius: 3px; }
  .admin-link:hover { background: #eb4b4b; color: white; }

  .cart-button { background: #4c6b22; color: #a4d007; border: none; padding: 7px 16px; border-radius: 3px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: background .15s; }
  .cart-button:hover { background: #5a7a28; }
  .cart-badge { background: #a4d007; color: #1a1a1a; border-radius: 10px; padding: 1px 7px; font-size: 11px; font-weight: 700; }
  .hero { background: linear-gradient(135deg, #1b2838 0%, #1e3a5f 50%, #1b2838 100%); border-bottom: 1px solid #2a3a50; padding: 2.5rem 2rem; position: relative; overflow: hidden; }
  .hero-inner { max-width: 1200px; margin: 0 auto; }
  .hero h1 { font-size: 28px; font-weight: 700; color: #fff; margin-bottom: 6px; }
  .hero p { color: #8f98a0; font-size: 14px; margin-bottom: 1.5rem; }
  .main { max-width: 1200px; margin: 0 auto; padding: 24px 2rem; display: grid; grid-template-columns: 220px 1fr; gap: 20px; align-items: start; }
  .sidebar { background: #171a21; border: 1px solid #2a2d35; border-radius: 4px; }
  .sidebar-section { border-bottom: 1px solid #2a2d35; padding: 14px 16px; }
  .sidebar-title { font-size: 11px; font-weight: 700; color: #8f98a0; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 10px; }
  .filter-list { list-style: none; }
  .filter-item { display: flex; align-items: center; justify-content: space-between; padding: 5px 8px; border-radius: 3px; cursor: pointer; font-size: 13px; color: #8f98a0; transition: background .1s, color .1s; }
  .filter-item:hover { background: #1e2329; color: #c6d4df; }
  .filter-item.active { background: #1e2329; color: #fff; }
  .filter-item .count { font-size: 11px; color: #4a5568; background: #1e2329; padding: 1px 6px; border-radius: 2px; }
  .rarity-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 8px; flex-shrink: 0; }
  .dot-Contraband { background: #e4ae39; }
  .dot-Covert { background: #eb4b4b; }
  .dot-Classified { background: #d32ce6; }
  .dot-Restricted { background: #8847ff; }
  .dot-MilSpec { background: #4b69ff; }
  .toolbar { background: #171a21; border: 1px solid #2a2d35; border-radius: 4px; padding: 10px 14px; display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .search-input { width: 100%; background: #1e2329; border: 1px solid #2a2d35; border-radius: 3px; color: #c6d4df; padding: 7px 10px 7px 34px; font-size: 13px; outline: none; }
  .search-wrap { flex: 1; position: relative; }
  .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); gap: 10px; }
  .card { background: #171a21; border: 1px solid #2a2d35; border-radius: 4px; overflow: hidden; cursor: pointer; transition: border-color .15s, transform .15s; position: relative; }
  .card:hover { border-color: #4a6a8a; transform: translateY(-2px); }
  .card-rarity-bar { height: 3px; width: 100%; }
  .bar-Contraband { background: #e4ae39; }
  .bar-Covert { background: #eb4b4b; }
  .bar-Classified { background: #d32ce6; }
  .bar-Restricted { background: #8847ff; }
  .bar-MilSpec { background: #4b69ff; }
  .card-img-wrap { background: #1b2838; height: 130px; display: flex; align-items: center; justify-content: center; padding: 12px; }
  .card-img-wrap img { width: 100%; height: 100%; object-fit: contain; }
  .card-body { padding: 10px 12px 12px; }
  .card-name { font-size: 13px; font-weight: 600; color: #c6d4df; margin-bottom: 6px; line-height: 1.3; min-height: 34px; }
  .price-current { font-size: 16px; font-weight: 700; color: #a4d007; }
  
  /* CART DRAWER & OVERLAY */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .overlay.open { opacity: 1; pointer-events: all; }
  .drawer { position: fixed; top: 0; right: 0; width: 360px; height: 100%; background: #171a21; border-left: 1px solid #2a2d35; z-index: 201; display: flex; flex-direction: column; transform: translateX(100%); transition: transform .2s; }
  .drawer.open { transform: translateX(0); }
</style>
</head>
<body>

<nav class="topbar">
  <a href="/" class="logo">Rex<span>Global</span></a>
  <div class="topbar-links">
    <a href="/" class="topbar-link active">Mağaza</a>
    <a href="#" class="topbar-link">Fırsatlar</a>
    <a href="#" class="topbar-link">Destek</a>
  </div>
  <div class="topbar-right">
    {% if is_admin %}
      <a href="/admin" class="admin-link">🛠 Admin Panel</a>
      <a href="/logout" style="color:#8f98a0; font-size:12px; text-decoration:none;">Çıkış</a>
    {% else %}
      <a href="/login" style="color:#8f98a0; font-size:12px; text-decoration:none;">Giriş Yap</a>
    {% endif %}
    
    <button class="cart-button" id="cartBtn">
      Sepet <span class="cart-badge" id="cartCount">0</span>
    </button>
  </div>
</nav>

<div class="hero">
  <div class="hero-inner">
    <h1>RexGlobal Expo Satış Mağazası</h1>
    <p>Güvenli ve hızlı teslimat. 7/24 destek.</p>
  </div>
</div>

<div class="main">
  <aside class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-title">Kategori</div>
      <ul class="filter-list" id="categoryList">
        <li class="filter-item active" data-value="all">Tümü</li>
        <li class="filter-item" data-value="Silah Kını">Silah Kını</li>
        <li class="filter-item" data-value="Bıçak">Bıçak</li>
      </ul>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-title">Nadirlik</div>
      <ul class="filter-list" id="rarityList">
        <li class="filter-item active" data-value="all">Tümü</li>
        <li class="filter-item" data-value="Covert"><span class="rarity-dot dot-Covert"></span>Covert</li>
        <li class="filter-item" data-value="Classified"><span class="rarity-dot dot-Classified"></span>Classified</li>
      </ul>
    </div>
  </aside>

  <div class="content">
    <div class="toolbar">
      <div class="search-wrap">
        <input type="text" class="search-input" id="searchInput" placeholder="İtem ara...">
      </div>
      <span class="results-count" id="resultsCount">0 ürün</span>
    </div>
    <div class="items-grid" id="itemsGrid">
        </div>
  </div>
</div>

<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer">
    <div style="padding:20px; color:white;">
        <h3>Sepetim</h3>
        <div id="drawerItems"></div>
        <button onclick="closeCart()" style="margin-top:20px; width:100%; padding:10px; background:#4a5568; border:none; color:white; cursor:pointer;">Kapat</button>
    </div>
</div>

<script>
let state = { category: 'all', rarity: 'all', q: '' };
let cart = [];
let allItems = [];

async function loadItems() {
    const params = new URLSearchParams(state);
    const res = await fetch('/api/items?' + params);
    const items = await res.json();
    allItems = items;
    
    document.getElementById('resultsCount').textContent = items.length + ' ürün';
    const grid = document.getElementById('itemsGrid');
    
    if(items.length === 0) {
        grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:50px;">Ürün bulunamadı.</div>';
        return;
    }

    grid.innerHTML = items.map(item => `
        <div class="card" onclick="addToCart(${item.id})">
            <div class="card-rarity-bar bar-${item.rarity}"></div>
            <div class="card-img-wrap">
                <img src="${item.img}" alt="${item.name}">
            </div>
            <div class="card-body">
                <div class="card-name">${item.name}</div>
                <div class="price-current">$${item.price.toFixed(2)}</div>
            </div>
        </div>
    `).join('');
}

function addToCart(id) {
    const item = allItems.find(i => i.id === id);
    if(item) {
        cart.push(item);
        document.getElementById('cartCount').textContent = cart.length;
        alert(item.name + " sepete eklendi!");
    }
}

function openCart() { document.getElementById('overlay').classList.add('open'); document.getElementById('drawer').classList.add('open'); }
function closeCart() { document.getElementById('overlay').classList.remove('open'); document.getElementById('drawer').classList.remove('open'); }

document.getElementById('cartBtn').addEventListener('click', openCart);
document.getElementById('categoryList').addEventListener('click', e => {
    const li = e.target.closest('.filter-item');
    if(!li) return;
    document.querySelectorAll('#categoryList .filter-item').forEach(el => el.classList.remove('active'));
    li.classList.add('active');
    state.category = li.dataset.value;
    loadItems();
});

document.getElementById('searchInput').addEventListener('input', e => {
    state.q = e.target.value;
    loadItems();
});

loadItems();
</script>
</body>
</html>
