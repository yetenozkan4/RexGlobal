<!DOCTYPE html>
<html>
<head>
    <title>Admin Paneli — RexGlobal</title>
    <style>
        body { background: #0f1114; color: #c6d4df; font-family: sans-serif; padding: 50px; }
        .form-container { max-width: 500px; margin: 0 auto; background: #171a21; padding: 30px; border-radius: 8px; border: 1px solid #2a2d35; }
        input, select { width: 100%; padding: 10px; margin: 10px 0; background: #1e2329; border: 1px solid #2a2d35; color: white; border-radius: 4px; }
        button { width: 100%; padding: 12px; background: #4c6b22; color: #a4d007; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; }
        h2 { text-align: center; color: white; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Yeni Ürün Ekle</h2>
        <form action="/admin/add" method="POST" enctype="multipart/form-data">
            <input type="text" name="name" placeholder="Ürün Adı (Örn: AK-47 | Redline)" required>
            <input type="number" step="0.01" name="price" placeholder="Fiyat ($)" required>
            <select name="category">
                <option value="Silah Kını">Silah Kını</option>
                <option value="Bıçak">Bıçak</option>
            </select>
            <select name="rarity">
                <option value="Covert">Covert (Kırmızı)</option>
                <option value="Classified">Classified (Pembe)</option>
                <option value="Restricted">Restricted (Mor)</option>
            </select>
            <input type="text" name="wear" placeholder="Aşınma (Örn: Factory New)">
            <input type="file" name="item_img"> <button type="submit">Ürünü Mağazaya Ekle</button>
        </form>
        <br>
        <a href="/" style="color: #66c0f4; text-decoration: none; display: block; text-align: center;">← Mağazaya Dön</a>
    </div>
</body>
</html>
